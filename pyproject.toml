[project]
name = "mcp-decision-hub"
version = "0.1.0"
description = "MCP decision hub - M1 skeleton"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.10,<3",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
