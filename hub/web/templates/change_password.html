{% extends "base.html" %}
{% block title %}修改密码 - MCP 决策中台{% endblock %}
{% block wrap_class %}wrap--auth{% endblock %}
{% block content %}

<div class="panel">
  <div class="panel-head">
    <h1>首次登录请修改密码</h1>
  </div>
  <div class="panel-body">

    <p class="small muted mb-16">
      初始密码由管理员发放。为保障账号安全，首次登录必须先设置新密码，之后才能进入事项页面。
    </p>

    {% if error %}
    <div class="alert alert--error" role="alert"><div class="alert-body">{{ error }}</div></div>
    {% endif %}

    <form method="post" action="/change-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <label class="field">
        <span class="field-label">新密码<span class="req">*</span></span>
        <input class="input" name="new_password" type="password" required minlength="8"
               autocomplete="new-password" autofocus>
        <span class="field-hint">至少 8 位。</span>
      </label>
      <label class="field">
        <span class="field-label">确认新密码<span class="req">*</span></span>
        <input class="input" name="confirm_password" type="password" required
               autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn--primary btn--block mt-16"
              data-busy-label="保存中">保存</button>
    </form>

  </div>
</div>

{% endblock %}
