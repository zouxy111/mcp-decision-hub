{% extends "base.html" %}
{% block title %}总览 - MCP 决策中台{% endblock %}
{% block content %}
<h1>我的事项</h1>
<form method="get" action="/dashboard">
  <label>状态筛选
    <select name="status">
      <option value="" {% if not status_filter %}selected{% endif %}>全部</option>
      {% for s in ["draft", "in_progress", "collecting", "blocked",
                   "awaiting_decision", "completed", "cancelled"] %}
      <option value="{{ s }}" {% if status_filter == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">筛选</button>
</form>
{% if not matters %}
<p>暂无事项。<a href="/matters/new">新建一个</a>。</p>
{% else %}
<table>
  <tr><th>主题</th><th>状态</th><th>创建时间(UTC)</th></tr>
  {% for m in matters %}
  <tr>
    <td><a href="/matters/{{ m.id }}">{{ m.title }}</a></td>
    <td>{{ m.status }}</td>
    <td>{{ m.created_at.strftime("%Y-%m-%dT%H:%M:%SZ") }}</td>
  </tr>
  {% endfor %}
</table>
{% endif %}
{% endblock %}
